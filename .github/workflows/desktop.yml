# Builds and tests the Windows desktop app on every change to desktop/.
# The release job (added in the polish phase) publishes the self-contained .exe.
name: Desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SaveState.sln
      - run: dotnet build SaveState.sln --configuration Release --no-restore
      - run: dotnet test SaveState.sln --configuration Release --no-build --verbosity normal
